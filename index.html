<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Catálogos — Menú</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<canvas id="particles"></canvas>
		<header class="site-header">
			<img src="logo.png" alt="Logo" class="site-logo" />
		</header>
		<main class="container">
			<h1>Catálogos 2025-2026</h1>
			<p class="subtitle">Haz clic en una portada para ver en una nueva página.</p>

			<div id="grid" class="grid" aria-live="polite"></div>

			<footer class="footer"> <h2>ARTESKALA PUBLICIDAD.</h2>Todos los derechos reservados</footer>
			
			<!-- WhatsApp button -->
			<a id="waBtn" class="whatsapp-btn" href="https://wa.me/524773274424" target="_blank" rel="noopener noreferrer">WhatsApp</a>
		</main>

		<script>
			// Lista de catálogos: img -> portada; pdf -> archivo PDF en la misma carpeta; url -> enlace externo (si existe)
			// He incluido dos entradas externas de ejemplo (promocionales y 2025-2026). Cambia las URLs según necesites.
			const items = [
				{ title: 'CDO', img: 'm-line.png', type: 'external', url: 'https://heyzine.com/flip-book/bfaa6410cb.html#page/1' },
				{ title: 'IMPRESSLINE', img: 'line.png', type: 'external', url: 'https://issuu.com/3doubleu/docs/impressline._catalogo_2026' },
				{ title: 'MAXA', img: 'maxa.png', type: "external", url: "https://drive.google.com/file/d/1z82EwOpEJZoebJVF2bSWqt-A4Kcb58Em/view?usp=sharing" },
				{ title: 'G4', img: 'g4.png', type: "external" , url: "https://online.flippingbook.com/view/693581/" },
				{ title: 'FITCAP', img: 'fitcap.png', type: "external", url: "https://dkps.com.mx/wp-content/uploads/2024/03/FITCAP-2024-3.pdf" },
				{ title: 'DKPS', img: 'dkps.png', type: "external", url: "https://dkps.com.mx/wp-content/uploads/2024/12/CATALOGOS-DIGITALES-DKPSYFITCAP-2024.pdf" },
				{ title: 'INNOVATION', img: 'cat.png', type: "external", url: "https://online.flippingbook.com/view/939406/" },
	                { title: "PROMOOPCIÓN" , img: "promocionales.jpeg", type: "external", url: "https://catalogo.promocionalesenlinea.com/catalogo2025-26/?page=1" },
                    { title: "DOBLE VELA" , img: "vela.png", type: "external", url: "https://www.doblevela.com/catalogovirtual/" },
                    { title: "BIC GRAPHIC", img: "big.png", type: "external", url: "https://www.bicgraphic.com.mx/archivos/Catalogo_BIC_Graphic.pdf" },
                    { title: "4PROMOTIONAL", img: "2025-2026.jpeg", type: "external", url: "https://online.flippingbook.com/view/904760688/" },
                    { title: "BOLSA ECOLÓGICA", img: "1.webp", pdf: "bolsas.pdf" },
			];

			const grid = document.getElementById('grid');

			items.forEach(it => {
				const card = document.createElement('article');
				card.className = 'card';

				const img = document.createElement('img');
				img.src = it.img;
				img.alt = it.title + ' — portada';
				img.loading = 'lazy';

				const title = document.createElement('h2');
				title.textContent = it.title;

				const link = document.createElement('a');
				if (it.type === 'external') {
					link.href = it.url;
					link.target = '_blank';
					link.rel = 'noopener noreferrer';
				} else if (it.pdf) {
					// abrir el visor local en una nueva pestaña
					const params = new URLSearchParams({ file: it.pdf });
					link.href = `viewer.html?${params.toString()}`;
					link.target = '_blank';
					link.rel = 'noopener noreferrer';
				}

				link.appendChild(img);
				link.appendChild(title);
				card.appendChild(link);
				grid.appendChild(card);
			});

				// add small click animation: add class then remove shortly
				document.querySelectorAll('.card a').forEach(a => {
					a.addEventListener('click', (e) => {
						const card = a.closest('.card');
						if (!card) return;
						card.classList.add('clicked');
						setTimeout(() => card.classList.remove('clicked'), 250);
					});
				});

				// Particles background
				(function(){
					const canvas = document.getElementById('particles');
					const ctx = canvas.getContext('2d');
					let w, h, particles;

					const colors = ['#FFD166','#06D6A0','#4D96FF','#FF6B6B','#B388FF'];

					function resize() {
						w = canvas.width = window.innerWidth;
						h = canvas.height = window.innerHeight;
					}

					function initParticles(){
						particles = [];
						const count = Math.round((w*h)/60000); // density
						for(let i=0;i<count;i++){
							particles.push({
								x: Math.random()*w,
								y: Math.random()*h,
								r: Math.random()*2+0.6,
								col: colors[Math.floor(Math.random()*colors.length)],
								yVel: (Math.random()-0.5)*0.4,
								xVel: (Math.random()-0.5)*0.4,
								alpha: 0.6+Math.random()*0.4
							});
						}
					}

					function draw(){
						ctx.clearRect(0,0,w,h);
						ctx.fillStyle = 'rgba(0,0,0,0)';
						for(const p of particles){
							p.x += p.xVel; p.y += p.yVel;
							if (p.x < -10) p.x = w+10; if (p.x > w+10) p.x = -10;
							if (p.y < -10) p.y = h+10; if (p.y > h+10) p.y = -10;
							ctx.beginPath();
							ctx.globalAlpha = p.alpha;
							ctx.fillStyle = p.col;
							ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
							ctx.fill();
						}
						ctx.globalAlpha = 1;
						requestAnimationFrame(draw);
					}

					window.addEventListener('resize', () => { resize(); initParticles(); });
					resize(); initParticles(); draw();
				})();
		</script>

			<style>
				/* small inline styles for header/particles layering to keep files minimal */
				.site-header{position:fixed;top:8px;left:12px;z-index:10}
				.site-logo{height:46px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.25))}
				#particles{position:fixed;inset:0;z-index:-1;pointer-events:none}
				.whatsapp-btn{position:fixed;right:18px;bottom:18px;background:#25D366;color:#fff;padding:12px 16px;border-radius:28px;text-decoration:none;box-shadow:0 6px 20px rgba(37,211,102,0.2);font-weight:700;z-index:20}
			</style>
	</body>
</html>
