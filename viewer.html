<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Visor de PDF</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .viewer { display:flex; flex-direction:column; height:100vh; }
      .viewer .top { padding:12px; background:#f5f5f5; display:flex; gap:12px; align-items:center; }
      .viewer iframe { flex:1; border:none; width:100%; }
    </style>
  </head>
  <body>
    <div class="viewer">
      <div class="top">
        <a href="index.html">← Volver</a>
        <div id="path" style="font-weight:600"></div>
        <div style="margin-left:auto"><a id="openDirect" href="#" target="_blank">Abrir PDF en otra pestaña</a></div>
      </div>
      <div id="frameWrap" style="flex:1;display:flex;">
        <!-- PDF se cargará aquí -->
      </div>
    </div>

    <script>
      function sanitizePath(p) {
        // evitar rutas con .. y quitar protocolos
        if (!p) return '';
        if (p.includes('..')) return '';
        if (p.match(/^https?:\/\//i)) return p; // permitir si es absoluto (aunque no recomendado)
        return p;
      }

      const params = new URLSearchParams(location.search);
      const file = params.get('file');
      const safe = sanitizePath(file);
      const wrap = document.getElementById('frameWrap');
      const pathEl = document.getElementById('path');
      const openDirect = document.getElementById('openDirect');

      if (!safe) {
        wrap.innerHTML = '<div style="padding:24px">No se indicó un archivo válido. Vuelve a <a href="index.html">la página principal</a>.</div>';
      } else {
        pathEl.textContent = safe;
        openDirect.href = safe;

        // Usar <iframe> si el navegador lo soporta y el PDF está en la misma carpeta.
        const iframe = document.createElement('iframe');
        iframe.src = safe;
        iframe.title = 'Visor PDF: ' + safe;
        wrap.appendChild(iframe);

        // Fallback: enlace al archivo
        const fallback = document.createElement('div');
        fallback.style.padding = '12px';
        fallback.innerHTML = `Si tu navegador no muestra el PDF, <a href="${safe}" target="_blank">ábrelo aquí</a>.`;
        wrap.appendChild(fallback);
      }
    </script>
  </body>
</html>
